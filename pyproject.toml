[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vite"
version = "1.0.0"
description = "VITE - Validación de Información de Terceros Exógena"
requires-python = ">=3.13"
dependencies = [
    "textual>=0.70.0",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "playwright>=1.44.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
vite = "vite.tui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
